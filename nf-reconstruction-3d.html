<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>N/F — 3D Reconstruction</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #000;
}

body {
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

#app {
  position: fixed;
  inset: 0;
  background: #000;
  overflow: hidden;
  touch-action: none;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}


/* ---------------------------------------------------------
   CINEMATIC OVERLAY
--------------------------------------------------------- */

.vignette {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 32%,
      rgba(0,0,0,.16) 57%,
      rgba(0,0,0,.82) 100%
    );

  z-index: 20;
}


.color-grade {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    radial-gradient(
      ellipse at 50% 40%,
      rgba(0,110,255,.08),
      transparent 48%
    );

  mix-blend-mode: screen;

  z-index: 21;
}


/* ---------------------------------------------------------
   SMALL UI
--------------------------------------------------------- */

.label {

  position: absolute;

  left: 50%;
  bottom: 18px;

  transform: translateX(-50%);

  z-index: 30;

  padding:
    7px
    13px;

  border:
    1px solid
    rgba(80,160,255,.15);

  border-radius: 999px;

  background:
    rgba(0,0,0,.35);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  color:
    rgba(180,220,255,.48);

  font-size: 8px;
  font-weight: 800;

  letter-spacing:
    .25em;

  white-space: nowrap;

  pointer-events: none;
}

</style>
</head>


<body>

<div id="app">

  <div class="vignette"></div>

  <div class="color-grade"></div>

  <div class="label">
    N/F · INTERACTIVE 3D
  </div>

</div>


<script type="module">

import * as THREE from
"https://esm.sh/three@0.165.0";



/* =========================================================
   RENDERER
========================================================= */

const app =
document.getElementById("app");


const renderer =
new THREE.WebGLRenderer({

  antialias: true,

  alpha: false,

  powerPreference:
    "high-performance"

});


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);


renderer.outputColorSpace =
THREE.SRGBColorSpace;


renderer.toneMapping =
THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
1.12;


app.prepend(
  renderer.domElement
);



/* =========================================================
   SCENE
========================================================= */

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0x000000);



/* =========================================================
   CAMERA
========================================================= */

const camera =
new THREE.PerspectiveCamera(

  32,

  window.innerWidth /
  window.innerHeight,

  .1,

  100

);


camera.position.set(
  0,
  0,
  14
);



/* =========================================================
   MAIN WORLD
========================================================= */

const world =
new THREE.Group();


scene.add(
  world
);



/* =========================================================
   REFERENCE IMAGE
=========================================================

   Das Originalbild bleibt im Hintergrund erhalten.
   Dadurch bleiben Berge, Personen, Atmosphäre usw.
   exakt an der visuellen Vorlage orientiert.

========================================================= */

const textureLoader =
new THREE.TextureLoader();


const referenceTexture =
textureLoader.load(

  "IMG_2071.png",

  texture => {

    texture.colorSpace =
      THREE.SRGBColorSpace;

  }

);


const backgroundMaterial =
new THREE.MeshBasicMaterial({

  map:
    referenceTexture,

  transparent:
    true,

  depthWrite:
    false

});


const background =
new THREE.Mesh(

  new THREE.PlaneGeometry(
    16,
    16
  ),

  backgroundMaterial

);


background.position.set(
  0,
  0,
  -4
);


world.add(
  background
);



/* =========================================================
   REAL 3D LOGO
========================================================= */

const logo =
new THREE.Group();


logo.position.set(
  0,
  1.45,
  0
);


world.add(
  logo
);



/* =========================================================
   MATERIAL
========================================================= */

const steel =
new THREE.MeshPhysicalMaterial({

  color:
    new THREE.Color(
      0x9da3a7
    ),

  metalness:
    1,

  roughness:
    .19,

  clearcoat:
    .55,

  clearcoatRoughness:
    .18,

  reflectivity:
    1

});


const steelDark =
new THREE.MeshPhysicalMaterial({

  color:
    new THREE.Color(
      0x3d454b
    ),

  metalness:
    1,

  roughness:
    .25,

  clearcoat:
    .45

});


const blue =
new THREE.MeshBasicMaterial({

  color:
    0x008cff

});


const blueGlow =
new THREE.MeshBasicMaterial({

  color:
    0x006eff,

  transparent:
    true,

  opacity:
    .32,

  side:
    THREE.DoubleSide

});



/* =========================================================
   LOGO SHAPE
=========================================================

   Komplexere Rekonstruktion des markanten
   N/F-Symbols.

========================================================= */

const N =
[
  [-4.8,-2.4],
  [-3.9,-1.25],
  [-3.15,2.65],
  [-4.32,2.65],

  [-3.05,2.65],
  [.12,-2.35],
  [1.05,-1.55],
  [-2.02,2.65],

  [-.9,2.65],
  [-.02,-1.48],
  [.55,-2.35]
];


const F_TOP =
[
  [.55,2.65],
  [1.48,2.65],
  [5.02,2.65],
  [4.42,1.38],
  [1.48,1.38]
];


const F_MIDDLE =
[
  [1.48,.92],
  [4.62,.92],
  [4.02,-.08],
  [1.48,-.08]
];


const F_BOTTOM =
[
  [2.25,-.42],
  [4.05,-.42],
  [3.27,-1.58],
  [2.25,-1.58]
];



/* =========================================================
   CREATE EXTRUDED SHAPE
========================================================= */

function createExtrudedShape(
  points,
  material,
  depth
) {

  const shape =
  new THREE.Shape();


  shape.moveTo(
    points[0][0],
    points[0][1]
  );


  for (
    let i = 1;
    i < points.length;
    i++
  ) {

    shape.lineTo(
      points[i][0],
      points[i][1]
    );

  }


  shape.closePath();


  const geometry =
  new THREE.ExtrudeGeometry(

    shape,

    {

      depth:
        depth,

      bevelEnabled:
        true,

      bevelThickness:
        .12,

      bevelSize:
        .095,

      bevelOffset:
        0,

      bevelSegments:
        5,

      curveSegments:
        3

    }

  );


  geometry.center();


  const mesh =
  new THREE.Mesh(
    geometry,
    material
  );


  mesh.castShadow =
    true;


  mesh.receiveShadow =
    true;


  return mesh;
}



/* =========================================================
   LOGO PARTS
========================================================= */

const parts =
[
  N,
  F_TOP,
  F_MIDDLE,
  F_BOTTOM
];


parts.forEach(
  points => {

    /*
      Blue rear extrusion
    */

    const rear =
    createExtrudedShape(
      points,
      blue,
      .92
    );


    rear.position.z =
      -.32;


    rear.scale.set(
      1.018,
      1.018,
      1
    );


    logo.add(
      rear
    );


    /*
      Main steel body
    */

    const body =
    createExtrudedShape(
      points,
      steel,
      .72
    );


    body.position.z =
      .04;


    logo.add(
      body
    );

  }
);



/* =========================================================
   BLUE LIGHT PLANE
========================================================= */

const bluePlane =
new THREE.Mesh(

  new THREE.PlaneGeometry(
    13,
    8
  ),

  blueGlow

);


bluePlane.position.set(
  0,
  .4,
  -.75
);


logo.add(
  bluePlane
);



/* =========================================================
   EDGE LIGHT
========================================================= */

const edgeMaterial =
new THREE.LineBasicMaterial({

  color:
    0x39adff,

  transparent:
    true,

  opacity:
    .9

});


function addEdge(
  points
) {

  const vertices =
  points.map(

    point =>
      new THREE.Vector3(
        point[0],
        point[1],
        .43
      )

  );


  vertices.push(
    vertices[0]
  );


  const geometry =
  new THREE.BufferGeometry()
  .setFromPoints(
    vertices
  );


  const line =
  new THREE.Line(
    geometry,
    edgeMaterial
  );


  logo.add(
    line
  );

}


parts.forEach(
  addEdge
);



/* =========================================================
   LIGHTING
========================================================= */

scene.add(

  new THREE.HemisphereLight(
    0x9bcfff,
    0x020304,
    .9
  )

);



const keyLight =
new THREE.DirectionalLight(
  0xffffff,
  4.5
);


keyLight.position.set(
  -4,
  7,
  8
);


scene.add(
  keyLight
);



const blueLight =
new THREE.DirectionalLight(
  0x008cff,
  5
);


blueLight.position.set(
  6,
  2,
  3
);


scene.add(
  blueLight
);



const bluePoint =
new THREE.PointLight(
  0x007cff,
  25,
  14
);


bluePoint.position.set(
  0,
  1,
  5
);


scene.add(
  bluePoint
);



/* =========================================================
   CAMERA DEPTH
========================================================= */

const cameraRig =
new THREE.Group();


cameraRig.add(
  camera
);


scene.add(
  cameraRig
);



/* =========================================================
   INTERACTION
========================================================= */

let dragging =
false;


let pointerX =
0;


let pointerY =
0;


let targetRotationY =
0;


let targetRotationX =
0;


let rotationY =
0;


let rotationX =
0;


let lastInteraction =
0;



app.addEventListener(
  "pointerdown",
  event => {

    dragging =
      true;

    pointerX =
      event.clientX;

    pointerY =
      event.clientY;

    lastInteraction =
      performance.now();

    app.setPointerCapture(
      event.pointerId
    );

  }
);



app.addEventListener(
  "pointermove",
  event => {

    if (!dragging)
      return;


    const dx =
      event.clientX -
      pointerX;


    const dy =
      event.clientY -
      pointerY;


    targetRotationY +=
      dx * .007;


    targetRotationX +=
      dy * .004;


    targetRotationX =
      THREE.MathUtils.clamp(
        targetRotationX,
        -.22,
        .22
      );


    pointerX =
      event.clientX;


    pointerY =
      event.clientY;


    lastInteraction =
      performance.now();

  }
);



app.addEventListener(
  "pointerup",
  () => {

    dragging =
      false;

  }
);



app.addEventListener(
  "pointercancel",
  () => {

    dragging =
      false;

  }
);



/* =========================================================
   ANIMATION
========================================================= */

const clock =
new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const t =
  clock.getElapsedTime();


  const idle =
  performance.now() -
  lastInteraction >
  1800;


  /*
    Automatische Rotation
  */

  const autoY =
    idle
      ? Math.sin(
          t * .32
        ) * .13
      : 0;


  const autoX =
    idle
      ? Math.sin(
          t * .24
        ) * .025
      : 0;


  const desiredY =
    targetRotationY +
    autoY;


  const desiredX =
    targetRotationX +
    autoX;


  rotationY +=
    (
      desiredY -
      rotationY
    ) * .045;


  rotationX +=
    (
      desiredX -
      rotationX
    ) * .045;



  /*
    Logo Rotation
  */

  logo.rotation.y =
    rotationY;


  logo.rotation.x =
    rotationX;


  logo.rotation.z =
    Math.sin(
      t * .3
    ) * .008;



  /*
    Kamera bewegt sich minimal
  */

  cameraRig.position.x =
    Math.sin(
      t * .19
    ) * .035;


  cameraRig.position.y =
    Math.sin(
      t * .23
    ) * .025;



  /*
    Blue Light Pulse
  */

  bluePoint.intensity =
    22 +
    Math.sin(
      t * .8
    ) * 4;



  /*
    Background Parallax
  */

  background.position.x =
    Math.sin(
      t * .16
    ) * .08;


  background.position.y =
    Math.cos(
      t * .13
    ) * .035;



  renderer.render(
    scene,
    camera
  );

}


animate();



/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )

    );

  }
);

</script>

</body>
</html>
