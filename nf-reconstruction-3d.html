<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>N/F — 3D</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 45%,
            #07111a 0%,
            #020509 45%,
            #000 78%
        );
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;

    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.18) 63%,
            rgba(0,0,0,.72) 100%
        );
}

.glow {
    position: fixed;

    left: 50%;
    top: 43%;

    width: 75vw;
    height: 55vh;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    background:
        radial-gradient(
            ellipse,
            rgba(0,110,255,.10),
            transparent 68%
        );

    filter: blur(45px);

    z-index: 2;
}

.badge {
    position: fixed;

    left: 50%;
    bottom: 24px;

    transform:
        translateX(-50%);

    padding:
        8px 15px;

    border:
        1px solid
        rgba(70,150,255,.18);

    border-radius:
        999px;

    color:
        rgba(190,220,255,.48);

    background:
        rgba(0,0,0,.30);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    font-size: 8px;
    font-weight: 800;
    letter-spacing: .22em;

    z-index: 20;

    white-space: nowrap;

    pointer-events: none;
}

</style>
</head>

<body>

<div id="app">

    <div class="glow"></div>

    <div class="vignette"></div>

    <div class="badge">
        N/F · DRAG TO ROTATE
    </div>

</div>


<script type="module">

import * as THREE from
"https://esm.sh/three@0.165.0";


/* =====================================================
   SETUP
===================================================== */

const app =
    document.getElementById("app");


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.15;


app.appendChild(
    renderer.domElement
);



/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        27,
        window.innerWidth /
        window.innerHeight,
        .1,
        100
    );


camera.position.z =
    14;



/* =====================================================
   MASTER GROUP
===================================================== */

const logoGroup =
    new THREE.Group();


scene.add(
    logoGroup
);


/*
    This is deliberately MUCH smaller
    than the previous version.
*/

logoGroup.scale.set(
    .78,
    .78,
    .78
);


/*
    Vertical positioning.
*/

logoGroup.position.y =
    .55;



/* =====================================================
   ORIGINAL IMAGE
===================================================== */

const image =
    new Image();


image.crossOrigin =
    "anonymous";


image.src =
    "IMG_2071.png";


/* =====================================================
   IMAGE → LOGO EXTRACTION
===================================================== */

/*
   Instead of manually recreating the logo,
   we take the actual pixels from your artwork.

   The original picture has a very bright metallic
   logo against a predominantly dark environment.

   Therefore we use brightness + saturation +
   position to isolate the logo.
*/

function buildLogoTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    /*
       Original artwork:
       1024 × 1536
    */

    const sourceWidth =
        1024;

    const sourceHeight =
        1536;


    /*
       Logo occupies roughly the upper half.
    */

    const cropX =
        45;

    const cropY =
        165;

    const cropWidth =
        935;

    const cropHeight =
        670;


    canvas.width =
        cropWidth;

    canvas.height =
        cropHeight;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        image,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        cropWidth,
        cropHeight
    );


    const pixels =
        ctx.getImageData(
            0,
            0,
            cropWidth,
            cropHeight
        );


    const data =
        pixels.data;


    /*
       Create a soft logo mask.

       Bright metallic pixels are preserved.
       Dark mountain/person pixels are removed.
    */

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        const brightness =
            (
                r * .299 +
                g * .587 +
                b * .114
            );


        const blue =
            b - (
                (r + g) / 2
            );


        /*
           Metallic silver:
           bright and relatively neutral.
        */

        let alpha = 0;


        if (
            brightness > 105 &&
            Math.abs(blue) < 70
        ) {

            alpha =
                Math.min(
                    255,
                    (
                        brightness - 85
                    ) * 3.0
                );

        }


        /*
           Blue illuminated edges.
        */

        if (
            blue > 18 &&
            brightness > 55
        ) {

            alpha =
                Math.max(
                    alpha,
                    Math.min(
                        255,
                        (
                            brightness - 40
                        ) * 2.4
                    )
                );

        }


        /*
           Remove very dark pixels.
        */

        if (
            brightness < 70
        ) {

            alpha =
                0;

        }


        data[i + 3] =
            alpha;

    }


    ctx.putImageData(
        pixels,
        0,
        0
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.anisotropy =
        renderer
        .capabilities
        .getMaxAnisotropy();


    texture.minFilter =
        THREE.LinearMipmapLinearFilter;


    texture.magFilter =
        THREE.LinearFilter;


    return {
        texture,
        width: cropWidth,
        height: cropHeight
    };

}



/* =====================================================
   CREATE FRONT FACE
===================================================== */

function createFront(
    result
) {

    const aspect =
        result.width /
        result.height;


    /*
       Reasonable physical size.
    */

    const height =
        6.4;


    const width =
        height * aspect;


    const geometry =
        new THREE.PlaneGeometry(
            width,
            height
        );


    const material =
        new THREE.MeshBasicMaterial({

            map:
                result.texture,

            transparent:
                true,

            alphaTest:
                .015,

            side:
                THREE.DoubleSide,

            depthWrite:
                true

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.z =
        .34;


    return mesh;

}



/* =====================================================
   CREATE DEPTH LAYER
===================================================== */

function createDepthLayer(
    texture,
    width,
    height,
    z,
    darken
) {

    const geometry =
        new THREE.PlaneGeometry(
            width,
            height
        );


    const material =
        new THREE.MeshPhysicalMaterial({

            map:
                texture,

            transparent:
                true,

            alphaTest:
                .015,

            color:
                new THREE.Color(
                    darken
                ),

            metalness:
                1,

            roughness:
                .27,

            side:
                THREE.DoubleSide

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.z =
        z;


    return mesh;

}



/* =====================================================
   CREATE BLUE BACKING
===================================================== */

function createBlueBacking(
    width,
    height
) {

    const geometry =
        new THREE.PlaneGeometry(
            width * 1.005,
            height * 1.005
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                0x006eff,

            transparent:
                true,

            opacity:
                .88,

            side:
                THREE.DoubleSide

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.z =
        -.34;


    return mesh;

}



/* =====================================================
   BUILD
===================================================== */

image.onload =
() => {

    const result =
        buildLogoTexture();


    /*
       Calculate dimensions.
    */

    const aspect =
        result.width /
        result.height;


    const height =
        6.4;


    const width =
        height * aspect;


    /*
       Blue rear plate.
    */

    logoGroup.add(
        createBlueBacking(
            width,
            height
        )
    );


    /*
       Multiple depth layers.

       These are very close together,
       creating believable physical depth
       without destroying the original artwork.
    */

    const depthSteps =
        12;


    for (
        let i = 0;
        i < depthSteps;
        i++
    ) {

        const z =
            -.30 +
            (
                i *
                .048
            );


        const layer =
            createDepthLayer(

                result.texture,

                width,
                height,

                z,

                0.22 +
                i * .018

            );


        /*
           Darker layers are behind
           the actual front artwork.
        */

        logoGroup.add(
            layer
        );

    }


    /*
       Exact original front.
    */

    const front =
        createFront(
            result
        );


    logoGroup.add(
        front
    );


    /*
       Start animation.
    */

    animate();

};



/* =====================================================
   LIGHTING
===================================================== */

const ambient =
    new THREE.HemisphereLight(
        0x9fcfff,
        0x020304,
        .9
    );


scene.add(
    ambient
);


const whiteLight =
    new THREE.DirectionalLight(
        0xffffff,
        3.4
    );


whiteLight.position.set(
    -5,
    5,
    8
);


scene.add(
    whiteLight
);


const blueLight =
    new THREE.DirectionalLight(
        0x168cff,
        3.8
    );


blueLight.position.set(
    6,
    1,
    5
);


scene.add(
    blueLight
);


const rimLight =
    new THREE.PointLight(
        0x008cff,
        16,
        15
    );


rimLight.position.set(
    0,
    0,
    4
);


scene.add(
    rimLight
);



/* =====================================================
   INTERACTION
===================================================== */

let dragging =
    false;


let lastX =
    0;


let lastY =
    0;


let targetY =
    0;


let targetX =
    0;


let rotationY =
    0;


let rotationX =
    0;


let lastInteraction =
    0;



renderer.domElement.addEventListener(
    "pointerdown",
    e => {

        dragging =
            true;

        lastX =
            e.clientX;

        lastY =
            e.clientY;

        lastInteraction =
            performance.now();

        renderer.domElement.setPointerCapture(
            e.pointerId
        );

    }
);



renderer.domElement.addEventListener(
    "pointermove",
    e => {

        if (!dragging)
            return;


        const dx =
            e.clientX -
            lastX;


        const dy =
            e.clientY -
            lastY;


        /*
           Deliberately subtle.
        */

        targetY +=
            dx * .0032;


        targetX +=
            dy * .0018;


        /*
           Prevent crazy rotations.
        */

        targetY =
            THREE.MathUtils.clamp(
                targetY,
                -.34,
                .34
            );


        targetX =
            THREE.MathUtils.clamp(
                targetX,
                -.12,
                .12
            );


        lastX =
            e.clientX;


        lastY =
            e.clientY;


        lastInteraction =
            performance.now();

    }
);



renderer.domElement.addEventListener(
    "pointerup",
    () => {

        dragging =
            false;

    }
);



renderer.domElement.addEventListener(
    "pointercancel",
    () => {

        dragging =
            false;

    }
);



/* =====================================================
   ANIMATION
===================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const t =
        clock.getElapsedTime();


    /*
       Idle animation.

       Very small movement.
    */

    const idle =
        performance.now() -
        lastInteraction >
        1500;


    const autoY =
        idle
            ? Math.sin(
                t * .28
              ) * .075
            : 0;


    const autoX =
        idle
            ? Math.sin(
                t * .21
              ) * .018
            : 0;


    const desiredY =
        targetY +
        autoY;


    const desiredX =
        targetX +
        autoX;


    rotationY +=
        (
            desiredY -
            rotationY
        ) * .045;


    rotationX +=
        (
            desiredX -
            rotationX
        ) * .045;


    logoGroup.rotation.y =
        rotationY;


    logoGroup.rotation.x =
        rotationX;


    /*
       Tiny floating movement.
    */

    logoGroup.position.y =
        .55 +
        Math.sin(
            t * .55
        ) * .018;


    /*
       Blue light breathing.
    */

    rimLight.intensity =
        16 +
        Math.sin(
            t * .8
        ) * 2.5;


    renderer.render(
        scene,
        camera
    );

}



/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

    }
);

</script>

</body>
</html>
