<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>N/F — Exact 3D Reconstruction</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
}

body {
    background:
        radial-gradient(
            ellipse at center,
            #07111a 0%,
            #020407 48%,
            #000000 100%
        );
}

#stage {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    touch-action: none;

    cursor: grab;
}

#stage:active {
    cursor: grabbing;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}


/* -------------------------------------------------------
   CINEMATIC ATMOSPHERE
------------------------------------------------------- */

.atmosphere {
    position: absolute;

    width: 80vw;
    height: 70vh;

    left: 50%;
    top: 44%;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            ellipse,
            rgba(0, 105, 255, .12),
            rgba(0, 50, 130, .035) 42%,
            transparent 72%
        );

    filter: blur(40px);

    pointer-events: none;

    z-index: 5;
}


.vignette {
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 38%,
            rgba(0,0,0,.18) 60%,
            rgba(0,0,0,.82) 100%
        );

    z-index: 10;
}


.info {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform:
        translateX(-50%);

    padding:
        7px 13px;

    border:
        1px solid
        rgba(70,170,255,.18);

    border-radius:
        999px;

    background:
        rgba(0,5,10,.42);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    color:
        rgba(180,220,255,.5);

    font-family:
        Inter,
        system-ui,
        sans-serif;

    font-size:
        8px;

    font-weight:
        800;

    letter-spacing:
        .24em;

    white-space:
        nowrap;

    pointer-events:
        none;

    z-index:
        20;
}

</style>
</head>


<body>

<div id="stage">

    <div class="atmosphere"></div>

    <div class="vignette"></div>

    <div class="info">
        N/F · 3D
    </div>

</div>



<script type="module">

import * as THREE from
"https://esm.sh/three@0.165.0";



/* =========================================================
   STAGE
========================================================= */

const stage =
    document.getElementById("stage");



/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.12;


stage.prepend(
    renderer.domElement
);



/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();



/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        30,

        window.innerWidth /
        window.innerHeight,

        .1,

        100

    );


camera.position.set(
    0,
    0,
    12
);



/* =========================================================
   MAIN RIG
========================================================= */

const rig =
    new THREE.Group();


scene.add(
    rig
);



/* =========================================================
   ORIGINAL IMAGE
========================================================= */

const image =
    new Image();


image.crossOrigin =
    "anonymous";


image.src =
    "IMG_2071.png";



/* =========================================================
   ORIGINAL IMAGE DIMENSIONS

   Your image:
   1024 × 1536
========================================================= */

const IMAGE_WIDTH =
    1024;

const IMAGE_HEIGHT =
    1536;



/* =========================================================
   LOGO BOUNDING BOX

   Carefully traced from the supplied image.
========================================================= */

const CROP_LEFT =
    60;

const CROP_TOP =
    175;

const CROP_RIGHT =
    965;

const CROP_BOTTOM =
    805;


const CROP_WIDTH =
    CROP_RIGHT -
    CROP_LEFT;


const CROP_HEIGHT =
    CROP_BOTTOM -
    CROP_TOP;



/* =========================================================
   PRECISE LOGO MASK

   Coordinates are based directly on the
   supplied reference image.

   These polygons define the actual visible
   metal surfaces of the logo.
========================================================= */

const logoPolygons = [

    /* ---------------------------------------------
       MAIN DIAGONAL N
    --------------------------------------------- */

    [
        [164,198],
        [304,198],
        [586,704],
        [525,614],
        [220,265]
    ],


    /* ---------------------------------------------
       LEFT VERTICAL
    --------------------------------------------- */

    [
        [228,264],
        [264,297],
        [219,594],
        [78,781],
        [101,731],
        [216,590]
    ],


    /* ---------------------------------------------
       CENTER VERTICAL
    --------------------------------------------- */

    [
        [559,300],
        [642,300],
        [607,588],
        [579,734],
        [528,614]
    ],


    /* ---------------------------------------------
       TOP F BAR
    --------------------------------------------- */

    [
        [566,286],
        [642,198],
        [947,198],
        [861,287],
        [858,302],
        [555,302]
    ],


    /* ---------------------------------------------
       MIDDLE F BAR
    --------------------------------------------- */

    [
        [676,352],
        [947,352],
        [847,466],
        [742,466],
        [742,457],
        [699,457],
        [712,444],
        [846,444],
        [861,429],
        [691,429]
    ]

];



/* =========================================================
   IMAGE → 3D COORDINATE
========================================================= */

const WORLD_WIDTH =
    10.6;


const SCALE =
    WORLD_WIDTH /
    CROP_WIDTH;


function imageToWorldX(
    x
) {

    return (
        x -
        CROP_LEFT -
        CROP_WIDTH / 2
    ) * SCALE;

}


function imageToWorldY(
    y
) {

    return -(
        y -
        CROP_TOP -
        CROP_HEIGHT / 2
    ) * SCALE;

}



/* =========================================================
   CREATE FRONT TEXTURE

   The original image is drawn onto a transparent
   canvas using the exact logo mask.

   Therefore the front face is NOT recreated.
   It is literally the original logo artwork.
========================================================= */

function createLogoTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        CROP_WIDTH;

    canvas.height =
        CROP_HEIGHT;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        CROP_WIDTH,
        CROP_HEIGHT
    );


    /*
       Draw original artwork
    */

    ctx.drawImage(

        image,

        CROP_LEFT,
        CROP_TOP,
        CROP_WIDTH,
        CROP_HEIGHT,

        0,
        0,
        CROP_WIDTH,
        CROP_HEIGHT

    );


    /*
       Create mask
    */

    const mask =
        document.createElement(
            "canvas"
        );


    mask.width =
        CROP_WIDTH;

    mask.height =
        CROP_HEIGHT;


    const maskCtx =
        mask.getContext(
            "2d"
        );


    maskCtx.fillStyle =
        "#ffffff";


    logoPolygons.forEach(
        polygon => {

            maskCtx.beginPath();


            polygon.forEach(
                (point, index) => {

                    const x =
                        point[0] -
                        CROP_LEFT;


                    const y =
                        point[1] -
                        CROP_TOP;


                    if (
                        index === 0
                    ) {

                        maskCtx.moveTo(
                            x,
                            y
                        );

                    } else {

                        maskCtx.lineTo(
                            x,
                            y
                        );

                    }

                }
            );


            maskCtx.closePath();

            maskCtx.fill();

        }
    );


    /*
       Apply alpha mask
    */

    const original =
        ctx.getImageData(
            0,
            0,
            CROP_WIDTH,
            CROP_HEIGHT
        );


    const maskData =
        maskCtx.getImageData(
            0,
            0,
            CROP_WIDTH,
            CROP_HEIGHT
        );


    for (
        let i = 0;
        i < original.data.length;
        i += 4
    ) {

        original.data[i + 3] =
            maskData.data[i];

    }


    ctx.putImageData(
        original,
        0,
        0
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.anisotropy =
        renderer.capabilities.getMaxAnisotropy();


    texture.needsUpdate =
        true;


    return texture;

}



/* =========================================================
   CREATE FRONT PLANE
========================================================= */

function createFrontLogo(
    texture
) {

    const geometry =
        new THREE.PlaneGeometry(

            WORLD_WIDTH,

            CROP_HEIGHT * SCALE

        );


    const material =
        new THREE.MeshBasicMaterial({

            map:
                texture,

            transparent:
                true,

            alphaTest:
                .01,

            side:
                THREE.DoubleSide,

            depthWrite:
                true

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.z =
        .48;


    return mesh;

}



/* =========================================================
   CREATE REAL EXTRUSION
========================================================= */

function createExtrudedPart(
    polygon
) {

    const shape =
        new THREE.Shape();


    polygon.forEach(
        (point, index) => {

            const x =
                imageToWorldX(
                    point[0]
                );


            const y =
                imageToWorldY(
                    point[1]
                );


            if (
                index === 0
            ) {

                shape.moveTo(
                    x,
                    y
                );

            } else {

                shape.lineTo(
                    x,
                    y
                );

            }

        }
    );


    shape.closePath();


    /*
       Actual physical depth
    */

    const geometry =
        new THREE.ExtrudeGeometry(

            shape,

            {

                depth:
                    .72,

                bevelEnabled:
                    true,

                bevelThickness:
                    .055,

                bevelSize:
                    .045,

                bevelSegments:
                    3,

                curveSegments:
                    2

            }

        );


    geometry.translate(
        0,
        0,
        -.36
    );


    /*
       Side / back material
    */

    const material =
        new THREE.MeshPhysicalMaterial({

            color:
                0x596168,

            metalness:
                1,

            roughness:
                .22,

            clearcoat:
                .35,

            clearcoatRoughness:
                .2

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.z =
        -.05;


    return mesh;

}



/* =========================================================
   BLUE BACK EXTRUSION
========================================================= */

function createBlueExtrusion(
    polygon
) {

    const shape =
        new THREE.Shape();


    polygon.forEach(
        (point, index) => {

            const x =
                imageToWorldX(
                    point[0]
                );


            const y =
                imageToWorldY(
                    point[1]
                );


            if (
                index === 0
            ) {

                shape.moveTo(
                    x,
                    y
                );

            } else {

                shape.lineTo(
                    x,
                    y
                );

            }

        }
    );


    shape.closePath();


    const geometry =
        new THREE.ExtrudeGeometry(

            shape,

            {

                depth:
                    .18,

                bevelEnabled:
                    false

            }

        );


    geometry.translate(
        0,
        0,
        -.09
    );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                0x008cff,

            transparent:
                true,

            opacity:
                .95

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.z =
        -.47;


    return mesh;

}



/* =========================================================
   BLUE OUTER GLOW
========================================================= */

function createGlow(
    polygon
) {

    const points =
        polygon.map(
            point => {

                return new THREE.Vector3(

                    imageToWorldX(
                        point[0]
                    ),

                    imageToWorldY(
                        point[1]
                    ),

                    -.53

                );

            }
        );


    points.push(
        points[0].clone()
    );


    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(
            points
        );


    const material =
        new THREE.LineBasicMaterial({

            color:
                0x008cff,

            transparent:
                true,

            opacity:
                .9

        });


    const line =
        new THREE.Line(
            geometry,
            material
        );


    return line;

}



/* =========================================================
   BUILD 3D LOGO
========================================================= */

image.onload =
() => {

    /*
       Exact original front
    */

    const texture =
        createLogoTexture();


    const front =
        createFrontLogo(
            texture
        );


    rig.add(
        front
    );


    /*
       Real 3D extrusion
    */

    logoPolygons.forEach(
        polygon => {

            const extrusion =
                createExtrudedPart(
                    polygon
                );


            rig.add(
                extrusion
            );


            /*
               Blue rear layer
            */

            const blue =
                createBlueExtrusion(
                    polygon
                );


            rig.add(
                blue
            );


            /*
               Blue edge
            */

            const glow =
                createGlow(
                    polygon
                );


            rig.add(
                glow
            );

        }
    );


    start();

};



/* =========================================================
   LIGHTING
========================================================= */

const ambient =
    new THREE.HemisphereLight(

        0xb8dcff,

        0x010203,

        .8

    );


scene.add(
    ambient
);



const key =
    new THREE.DirectionalLight(

        0xffffff,

        4.2

    );


key.position.set(
    -4,
    7,
    8
);


scene.add(
    key
);



const cold =
    new THREE.DirectionalLight(

        0x3aa7ff,

        4.5

    );


cold.position.set(
    6,
    2,
    4
);


scene.add(
    cold
);



const bluePoint =
    new THREE.PointLight(

        0x008cff,

        22,

        14

    );


bluePoint.position.set(
    0,
    0,
    4
);


scene.add(
    bluePoint
);



/* =========================================================
   INTERACTION
========================================================= */

let dragging =
    false;


let lastX =
    0;


let lastY =
    0;


let targetY =
    0;


let targetX =
    0;


let currentY =
    0;


let currentX =
    0;


let lastInteraction =
    0;



stage.addEventListener(
    "pointerdown",
    event => {

        dragging =
            true;


        lastX =
            event.clientX;


        lastY =
            event.clientY;


        lastInteraction =
            performance.now();


        stage.setPointerCapture(
            event.pointerId
        );

    }
);



stage.addEventListener(
    "pointermove",
    event => {

        if (!dragging)
            return;


        const dx =
            event.clientX -
            lastX;


        const dy =
            event.clientY -
            lastY;


        targetY +=
            dx * .006;


        targetX +=
            dy * .003;


        targetX =
            THREE.MathUtils.clamp(
                targetX,
                -.25,
                .25
            );


        lastX =
            event.clientX;


        lastY =
            event.clientY;


        lastInteraction =
            performance.now();

    }
);



stage.addEventListener(
    "pointerup",
    () => {

        dragging =
            false;

    }
);



stage.addEventListener(
    "pointercancel",
    () => {

        dragging =
            false;

    }
);



/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function start() {

    animate();

}



function animate() {

    requestAnimationFrame(
        animate
    );


    const t =
        clock.getElapsedTime();


    const idle =
        performance.now() -
        lastInteraction >
        1800;


    /*
       Slow premium rotation
    */

    const automaticY =
        idle
            ? Math.sin(
                t * .30
              ) * .105
            : 0;


    const automaticX =
        idle
            ? Math.sin(
                t * .22
              ) * .018
            : 0;


    const desiredY =
        targetY +
        automaticY;


    const desiredX =
        targetX +
        automaticX;


    currentY +=
        (
            desiredY -
            currentY
        ) * .045;


    currentX +=
        (
            desiredX -
            currentX
        ) * .045;


    rig.rotation.y =
        currentY;


    rig.rotation.x =
        currentX;


    /*
       Very subtle floating movement
    */

    rig.position.y =
        Math.sin(
            t * .45
        ) * .025;


    /*
       Blue light breathing
    */

    bluePoint.intensity =
        20 +
        Math.sin(
            t * .8
        ) * 4;


    renderer.render(
        scene,
        camera
    );

}



/* =========================================================
   RESPONSIVE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

    }
);

</script>

</body>
</html>
