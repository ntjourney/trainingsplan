<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>N/F — Premium 3D</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;

    background:
        radial-gradient(
            ellipse at 50% 43%,
            #07121d 0%,
            #02060a 43%,
            #000000 80%
        );
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.background-glow {
    position: fixed;
    z-index: 1;

    left: 50%;
    top: 43%;

    width: 75vw;
    height: 55vh;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    background:
        radial-gradient(
            ellipse,
            rgba(0, 105, 255, .13),
            transparent 68%
        );

    filter: blur(45px);
}

.vignette {
    position: fixed;
    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.16) 62%,
            rgba(0,0,0,.78) 100%
        );
}

.hint {
    position: fixed;

    left: 50%;
    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    z-index: 20;

    padding:
        8px 15px;

    border:
        1px solid
        rgba(90,170,255,.20);

    border-radius:
        999px;

    background:
        rgba(0,5,10,.42);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    color:
        rgba(205,230,255,.52);

    font-size:
        8px;

    font-weight:
        800;

    letter-spacing:
        .20em;

    white-space:
        nowrap;

    pointer-events:
        none;
}
</style>
</head>


<body>

<div id="app">

    <div class="background-glow"></div>

    <div class="vignette"></div>

    <div class="hint">
        N/F · DRAG TO ROTATE
    </div>

</div>


<script type="module">

import * as THREE from
"https://esm.sh/three@0.165.0";



/* =========================================================
   RENDERER
========================================================= */

const app =
    document.getElementById("app");


const renderer =
    new THREE.WebGLRenderer({

        antialias:
            true,

        alpha:
            true,

        powerPreference:
            "high-performance"

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.20;


app.prepend(
    renderer.domElement
);



/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();



/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        28,

        window.innerWidth /
        window.innerHeight,

        0.1,

        100

    );


camera.position.set(
    0,
    0,
    14
);



/* =========================================================
   MASTER LOGO
========================================================= */

const logo =
    new THREE.Group();


scene.add(
    logo
);


/*
    Size is intentionally restrained.
*/

logo.scale.set(
    .76,
    .76,
    .76
);


logo.position.y =
    .25;



/* =========================================================
   PRECISE N/F SILHOUETTE
========================================================= */

/*
   Coordinates are based on the supplied
   reference image.

   Image coordinate system:

   x → right
   y → down
*/

const SHAPES = [

    /* =====================================================
       LEFT / MAIN N
    ===================================================== */

    [
        [165,249],
        [371,249],

        [635,728],
        [669,824],

        [700,877],

        [744,593],

        [779,376],

        [667,376],

        [635,728],

        [316,414],

        [276,698],

        [110,874],

        [218,610],

        [228,311]
    ],


    /* =====================================================
       TOP F BAR
    ===================================================== */

    [
        [685,364],
        [778,258],
        [1145,258],
        [1037,374],
        [858,374],
        [779,364]
    ],


    /* =====================================================
       LOWER F BAR
    ===================================================== */

    [
        [790,436],
        [1127,436],
        [1010,539],
        [842,539],
        [814,542],
        [840,557],
        [1027,557],
        [1110,479],
        [846,479],
        [790,521]
    ]

];



/* =========================================================
   COORDINATE SYSTEM
========================================================= */

const LEFT =
    105;

const RIGHT =
    1150;

const TOP =
    245;

const BOTTOM =
    885;


const WIDTH =
    RIGHT -
    LEFT;


const HEIGHT =
    BOTTOM -
    TOP;


const WORLD_WIDTH =
    10.7;


const SX =
    WORLD_WIDTH /
    WIDTH;


const SY =
    6.65 /
    HEIGHT;


function worldX(
    x
) {

    return (
        x -
        (
            LEFT +
            RIGHT
        ) / 2
    ) * SX;

}


function worldY(
    y
) {

    return -(
        y -
        (
            TOP +
            BOTTOM
        ) / 2
    ) * SY;

}



/* =========================================================
   CREATE SHAPE
========================================================= */

function createShape(
    points
) {

    const shape =
        new THREE.Shape();


    points.forEach(
        (
            point,
            index
        ) => {

            const x =
                worldX(
                    point[0]
                );


            const y =
                worldY(
                    point[1]
                );


            if (
                index === 0
            ) {

                shape.moveTo(
                    x,
                    y
                );

            }

            else {

                shape.lineTo(
                    x,
                    y
                );

            }

        }
    );


    shape.closePath();


    return shape;

}



/* =========================================================
   MATERIALS
========================================================= */

const metalSide =
    new THREE.MeshPhysicalMaterial({

        color:
            0x69727a,

        metalness:
            1,

        roughness:
            .20,

        clearcoat:
            .70,

        clearcoatRoughness:
            .12

    });


const metalFront =
    new THREE.MeshPhysicalMaterial({

        color:
            0xc4c9cd,

        metalness:
            1,

        roughness:
            .17,

        clearcoat:
            .85,

        clearcoatRoughness:
            .10

    });


const darkBack =
    new THREE.MeshPhysicalMaterial({

        color:
            0x0a1118,

        metalness:
            .95,

        roughness:
            .25

    });


const blueMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0x007cff,

        transparent:
            true,

        opacity:
            .95

    });



/* =========================================================
   BUILD EACH 3D SECTION
========================================================= */

for (
    const points of SHAPES
) {

    const shape =
        createShape(
            points
        );


    /* -----------------------------------------------------
       REAL EXTRUSION
    ----------------------------------------------------- */

    const extrusion =
        new THREE.ExtrudeGeometry(

            shape,

            {

                depth:
                    .72,

                bevelEnabled:
                    true,

                bevelThickness:
                    .055,

                bevelSize:
                    .045,

                bevelSegments:
                    4,

                curveSegments:
                    2

            }

        );


    extrusion.translate(
        0,
        0,
        -.36
    );


    const body =
        new THREE.Mesh(

            extrusion,

            metalSide

        );


    logo.add(
        body
    );



    /* -----------------------------------------------------
       FRONT FACE
    ----------------------------------------------------- */

    const frontGeometry =
        new THREE.ShapeGeometry(
            shape
        );


    const front =
        new THREE.Mesh(

            frontGeometry,

            metalFront

        );


    front.position.z =
        .37;


    logo.add(
        front
    );



    /* -----------------------------------------------------
       BACK FACE
    ----------------------------------------------------- */

    const backGeometry =
        new THREE.ShapeGeometry(
            shape
        );


    const back =
        new THREE.Mesh(

            backGeometry,

            darkBack

        );


    back.position.z =
        -.39;


    logo.add(
        back
    );



    /* -----------------------------------------------------
       BLUE EDGE
    ----------------------------------------------------- */

    const points3D =
        points.map(
            point => {

                return new THREE.Vector3(

                    worldX(
                        point[0]
                    ),

                    worldY(
                        point[1]
                    ),

                    -.43

                );

            }
        );


    points3D.push(
        points3D[0].clone()
    );


    const edgeGeometry =
        new THREE.BufferGeometry()
        .setFromPoints(
            points3D
        );


    const edge =
        new THREE.Line(

            edgeGeometry,

            blueMaterial

        );


    logo.add(
        edge
    );



    /* -----------------------------------------------------
       SECONDARY BLUE GLOW
    ----------------------------------------------------- */

    const glow =
        new THREE.Line(

            edgeGeometry,

            new THREE.LineBasicMaterial({

                color:
                    0x008cff,

                transparent:
                    true,

                opacity:
                    .25,

                blending:
                    THREE.AdditiveBlending

            })

        );


    glow.scale.set(
        1.012,
        1.012,
        1
    );


    logo.add(
        glow
    );

}



/* =========================================================
   METAL DETAIL
========================================================= */

/*
   Fine procedural brushed-metal texture.
*/

const textureCanvas =
    document.createElement(
        "canvas"
    );


textureCanvas.width =
    512;

textureCanvas.height =
    512;


const textureContext =
    textureCanvas.getContext(
        "2d"
    );


const textureData =
    textureContext.createImageData(
        512,
        512
    );


for (
    let i = 0;
    i < textureData.data.length;
    i += 4
) {

    const value =
        145 +
        Math.random() * 100;


    textureData.data[i] =
        value;

    textureData.data[i + 1] =
        value;

    textureData.data[i + 2] =
        value;

    textureData.data[i + 3] =
        30;

}


textureContext.putImageData(
    textureData,
    0,
    0
);


const metalTexture =
    new THREE.CanvasTexture(
        textureCanvas
    );


metalTexture.wrapS =
    THREE.RepeatWrapping;


metalTexture.wrapT =
    THREE.RepeatWrapping;


metalTexture.repeat.set(
    8,
    8
);


metalFront.map =
    metalTexture;


metalFront.color.set(
    0xffffff
);


metalFront.needsUpdate =
    true;



/* =========================================================
   LIGHTING
========================================================= */

const hemisphere =
    new THREE.HemisphereLight(

        0xd9ecff,

        0x010203,

        1.05

    );


scene.add(
    hemisphere
);



/* KEY LIGHT */

const keyLight =
    new THREE.DirectionalLight(

        0xffffff,

        4.6

    );


keyLight.position.set(
    -5,
    6,
    9
);


scene.add(
    keyLight
);



/* BLUE RIM */

const blueRim =
    new THREE.DirectionalLight(

        0x168cff,

        4.0

    );


blueRim.position.set(
    6,
    1,
    5
);


scene.add(
    blueRim
);



/* FRONT HIGHLIGHT */

const frontLight =
    new THREE.PointLight(

        0xffffff,

        7,

        12

    );


frontLight.position.set(
    -1,
    3,
    6
);


scene.add(
    frontLight
);



/* BLUE GLOW */

const blueGlow =
    new THREE.PointLight(

        0x008cff,

        17,

        16

    );


blueGlow.position.set(
    0,
    0,
    4
);


scene.add(
    blueGlow
);



/* =========================================================
   INTERACTION
========================================================= */

let dragging =
    false;


let previousX =
    0;


let previousY =
    0;


let targetRotationY =
    0;


let targetRotationX =
    0;


let currentRotationY =
    0;


let currentRotationX =
    0;


let lastInteraction =
    0;



renderer.domElement.addEventListener(

    "pointerdown",

    event => {

        dragging =
            true;


        previousX =
            event.clientX;


        previousY =
            event.clientY;


        lastInteraction =
            performance.now();


        renderer.domElement.setPointerCapture(
            event.pointerId
        );

    }

);



renderer.domElement.addEventListener(

    "pointermove",

    event => {

        if (
            !dragging
        ) {

            return;

        }


        const deltaX =
            event.clientX -
            previousX;


        const deltaY =
            event.clientY -
            previousY;


        targetRotationY +=
            deltaX *
            .003;


        targetRotationX +=
            deltaY *
            .0017;


        /*
           Controlled maximum rotation.
        */

        targetRotationY =
            THREE.MathUtils.clamp(

                targetRotationY,

                -.34,

                .34

            );


        targetRotationX =
            THREE.MathUtils.clamp(

                targetRotationX,

                -.12,

                .12

            );


        previousX =
            event.clientX;


        previousY =
            event.clientY;


        lastInteraction =
            performance.now();

    }

);



renderer.domElement.addEventListener(

    "pointerup",

    () => {

        dragging =
            false;

    }

);


renderer.domElement.addEventListener(

    "pointercancel",

    () => {

        dragging =
            false;

    }

);



/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    const idle =
        performance.now() -
        lastInteraction >
        1500;


    /*
       Extremely subtle automatic movement.
    */

    const automaticY =
        idle

            ? Math.sin(
                time * .27
              ) * .065

            : 0;


    const automaticX =
        idle

            ? Math.sin(
                time * .21
              ) * .015

            : 0;


    const desiredY =
        targetRotationY +
        automaticY;


    const desiredX =
        targetRotationX +
        automaticX;


    currentRotationY +=
        (
            desiredY -
            currentRotationY
        ) * .055;


    currentRotationX +=
        (
            desiredX -
            currentRotationX
        ) * .055;


    logo.rotation.y =
        currentRotationY;


    logo.rotation.x =
        currentRotationX;


    /*
       Almost invisible floating effect.
    */

    logo.position.y =
        .25 +
        Math.sin(
            time * .5
        ) * .018;


    /*
       Blue illumination breathing.
    */

    blueGlow.intensity =
        17 +
        Math.sin(
            time * .8
        ) * 2;


    renderer.render(
        scene,
        camera
    );

}


animate();



/* =========================================================
   RESPONSIVE
========================================================= */

window.addEventListener(

    "resize",

    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio || 1,

                2

            )

        );

    }

);

</script>

</body>
</html>
