<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>N/F — Cinematic Scene</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#010204}#scene{position:relative;width:100%;height:100%;overflow:hidden;perspective:1100px;background:radial-gradient(ellipse at 50% 60%,#182734 0%,#071018 32%,#010204 73%)}.mist{position:absolute;inset:35% -20% -15%;background:radial-gradient(ellipse,rgba(90,130,150,.19),transparent 61%);filter:blur(24px);opacity:.75}.mountains{position:absolute;inset:38% -8% 0;background:linear-gradient(145deg,transparent 0 17%,#17212b 17.2% 18%,transparent 18.3% 29%,#111b25 29.2% 30%,transparent 30.3% 39%,#17222c 39.2% 40%,transparent 40.3% 48%,#101923 48.2% 49%,transparent 49.3%);clip-path:polygon(0 56%,10% 30%,18% 49%,29% 17%,40% 55%,53% 34%,63% 53%,76% 12%,87% 47%,100% 30%,100% 100%,0 100%);background-color:#060c12;filter:drop-shadow(0 -4px 15px #385166)}.figures{position:absolute;left:50%;bottom:-2%;width:62%;height:42%;transform:translateX(-50%);display:flex;align-items:end;justify-content:center;gap:1.6vw;filter:drop-shadow(0 0 22px #000)}.person{background:linear-gradient(100deg,#030507,#202a33 50%,#030507);border:1px solid #26323a;box-shadow:inset 0 0 30px #000;border-radius:45% 45% 6% 6%/23% 23% 4% 4%}.person.center{width:19%;height:90%;border-radius:42% 42% 4% 4%/19% 19% 2% 2%}.person.side{width:15%;height:65%;opacity:.9}.badge{position:absolute;bottom:29%;left:50%;transform:translateX(-50%);padding:5px 7px;border:1px solid #59636d;color:#b8c2ca;font:700 clamp(6px,1vw,12px)/1 Arial;letter-spacing:.13em}.emblem{position:absolute;left:50%;top:47%;width:min(78vw,900px);height:min(41vw,470px);transform:translate(-50%,-50%) rotateX(-4deg) rotateY(-11deg);transform-style:preserve-3d;filter:drop-shadow(0 0 11px #007eff) drop-shadow(0 20px 25px #000)}.piece{position:absolute;background:linear-gradient(115deg,#252d35 0%,#d1d7dc 20%,#56616a 49%,#13191f 100%);border:1px solid #c4d2dd;box-shadow:inset 0 0 12px #fff4,0 0 7px #087eff;transform:translateZ(20px);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.n1{left:3%;top:8%;width:11%;height:84%;transform:skewY(-12deg) translateZ(20px)}.n2{left:12%;top:8%;width:16%;height:86%;transform:skewY(39deg) translateZ(38px)}.n3{left:39%;top:8%;width:10%;height:84%;transform:skewY(-6deg) translateZ(20px)}.f1{left:51%;top:10%;width:9%;height:80%;transform:skewY(-7deg) translateZ(20px)}.f2{left:55%;top:9%;width:37%;height:18%;transform:skewY(-9deg) translateZ(38px)}.f3{left:60%;top:44%;width:31%;height:17%;transform:skewY(-9deg) translateZ(38px)}.blue{position:absolute;background:#008cff;box-shadow:0 0 7px #008cff,0 0 18px #008cff;opacity:.95;transform:translateZ(3px)}.b1{left:0;bottom:4%;width:43%;height:2px;transform:rotate(-43deg)}.b2{left:51%;bottom:4%;width:47%;height:2px;transform:rotate(-45deg)}.hint{position:absolute;z-index:5;bottom:22px;width:100%;text-align:center;color:#8ac7ff;opacity:.65;font:700 10px Arial;letter-spacing:.22em}@media(max-width:600px){.emblem{width:108vw;height:57vw;top:43%}.figures{width:90%;height:35%}}
</style>
</head>
<body><main id="scene"><div class="mist"></div><div class="mountains"></div><div class="figures"><div class="person side"></div><div class="person center"><span class="badge">POLIZEI</span></div><div class="person side"></div></div><div class="emblem"><i class="piece n1"></i><i class="piece n2"></i><i class="piece n3"></i><i class="piece f1"></i><i class="piece f2"></i><i class="piece f3"></i><i class="blue b1"></i><i class="blue b2"></i></div><div class="hint">N/F · DRAG TO INSPECT</div></main><script>const s=document.querySelector('#scene'),e=document.querySelector('.emblem');let x=0,y=0,tx=0,ty=0,down=false;s.onpointerdown=a=>{down=true;x=a.clientX;y=a.clientY;s.setPointerCapture(a.pointerId)};s.onpointermove=a=>{if(!down)return;tx+=(a.clientX-x)*.11;ty+=(a.clientY-y)*.06;x=a.clientX;y=a.clientY;e.style.transform=`translate(-50%,-50%) rotateX(${-4-ty}deg) rotateY(${-11+tx}deg)`};s.onpointerup=()=>down=false;let t=0;function loop(){if(!down){t+=.012;tx*=.96;ty*=.96;e.style.transform=`translate(-50%,-50%) rotateX(${-4+ty+Math.sin(t*.7)*1.3}deg) rotateY(${-11+tx+Math.sin(t)*3}deg)`}requestAnimationFrame(loop)}loop()</script></body></html>
