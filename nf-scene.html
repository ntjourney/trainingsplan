<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>N/F — Interactive Key Art</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:#000;cursor:grab}#stage:active{cursor:grabbing}.art{position:absolute;inset:-4%;width:108%;height:108%;object-fit:contain;filter:contrast(1.04) saturate(1.04);will-change:transform}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.18) 74%,rgba(0,0,0,.64) 100%)}.blue{position:absolute;inset:-15%;pointer-events:none;mix-blend-mode:screen;opacity:.23;background:radial-gradient(ellipse at 48% 48%,rgba(0,126,255,.25),transparent 35%);filter:blur(20px);will-change:transform}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);color:#a5d9ff;opacity:.48;pointer-events:none;white-space:nowrap;font:700 9px/1 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase}@media(max-width:600px){.art{inset:-1%;width:102%;height:102%}.hint{bottom:12px;font-size:8px}}
</style>
</head>
<body>
<main id="stage" aria-label="Interaktive N/F Key-Art">
<img class="art" src="IMG_2071.png" alt="N/F Emblem mit Bergkulisse und drei Figuren">
<div class="blue"></div><div class="vignette"></div><div class="hint">N/F · DRAG TO INSPECT</div>
</main>
<script>
const stage=document.querySelector('#stage'),art=document.querySelector('.art'),blue=document.querySelector('.blue');let px=0,py=0,tx=0,ty=0,active=false;function target(e){const r=stage.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2}stage.addEventListener('pointerdown',e=>{active=true;target(e);stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(active)target(e)});stage.addEventListener('pointerup',()=>active=false);stage.addEventListener('pointercancel',()=>active=false);function loop(){if(!active){tx*=.975;ty*=.975}px+=(tx-px)*.055;py+=(ty-py)*.055;art.style.transform=`translate(${px*13}px,${py*9}px) scale(${1.025+Math.abs(px)*.008})`;blue.style.transform=`translate(${-px*32}px,${-py*24}px)`;requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
