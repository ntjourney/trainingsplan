<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Trainingsplan</title><style>:root{--b:#090c10;--c:#141a21;--l:#293440;--x:#d9ff36;--t:#f1f5f9;--m:#9ba8b6}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px system-ui}.a{max-width:850px;margin:auto;padding:24px 16px 60px}.tag{color:var(--x);font-weight:800;font-size:12px;letter-spacing:2px}h1{font-size:clamp(38px,8vw,70px);line-height:.9;letter-spacing:-4px;margin:10px 0 14px}p{color:var(--m)}.c{margin-top:16px;padding:18px;background:var(--c);border:1px solid var(--l);border-radius:15px}.row{display:flex;gap:8px;overflow:auto;padding-bottom:4px}button{padding:9px 12px;border:1px solid var(--l);border-radius:9px;background:#0e1319;color:var(--t);font:inherit;white-space:nowrap;cursor:pointer}.on,.save{background:var(--x);color:#121609;border-color:var(--x);font-weight:800}.lab{display:block;margin:0 0 8px;color:var(--m);font-size:13px;font-weight:700}#task{font-size:18px;line-height:1.5}.rpe{color:#76e9b8;font-size:13px}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;background:#090d12;color:var(--t);font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}.check{display:flex;gap:9px;align-items:center}.check input{width:20px}.save{border:0}.ok{color:#76e9b8;font-weight:bold;display:none}@media(max-width:520px){form{grid-template-columns:1fr}}</style><main class="a"><div class="tag">VORBEREITUNG · PRIVAT</div><h1>Mein<br>Trainingsplan.</h1><p>Woche und Tag wählen, Training durchführen und dein Ergebnis speichern.</p><section class="c"><span class="lab">1 · WOCHE</span><div class="row" id="ws"></div></section><section class="c"><span class="lab">2 · TAG</span><div class="row" id="ds"></div></section><section class="c"><span class="lab" id="title"></span><div class="rpe" id="rp"></div><p id="task"></p></section><section class="c"><h2>Dein Ergebnis</h2><p>Gespeichert nur in diesem Browser auf diesem Gerät.</p><form id="f"><label class="check full"><input id="done" type="checkbox">Training erledigt</label><label><span class="lab">DEIN RPE</span><select id="r"><option value="">–</option><option>3–4 locker</option><option>6–7 fordernd</option><option>8–9 sehr hart/Test</option></select></label><label><span class="lab">ZEIT / ERGEBNIS</span><input id="res" placeholder="z. B. 5 km · 24:30"></label><label class="full"><span class="lab">NOTIZ</span><textarea id="n" placeholder="Gewicht, Wiederholungen, Gefühl …"></textarea></label><div class="full"><button class="save">Training speichern</button> <span class="ok" id="ok">Gespeichert ✓</span></div></form></section></main><script>let W=0,D=0,N=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];let A=[['25–30 Min. locker + Kraft A','Mobilität + Spaziergang','6×1 Min. zügig, 2 Min. locker','Kraft B','Mobilität + Spaziergang','35–40 Min. locker','Ruhetag'],['30–35 Min. locker + Kraft A','Mobilität + Spaziergang','7×1 Min. zügig, 2 Min. locker','Kraft B','Mobilität + Spaziergang','40–45 Min. locker','Ruhetag'],['35 Min. locker + Kraft A','Mobilität + Spaziergang','6×2 Min. zügig, 2 Min. locker','Kraft B','Mobilität + Spaziergang','45–50 Min. locker','Ruhetag'],['30–35 Min. locker + Kraft A','Mobilität + Spaziergang','5×3 Min. zügig, 2 Min. locker','Kraft B','Mobilität + Spaziergang','5-km-Standorttest','Ruhetag'],['35–40 Min. locker + Kraft A','Mobilität + Schwimmen','6×400 m, 2 Min. Pause','Kraft B reduziert + Parcours 3 Runden','Mobilität + Schwimmen','50 Min. locker','Ruhetag'],['50-kg-Banktest + Kraft A','Mobilität + Schwimmen','8×400 m, 2 Min. Pause','Kraft B','Mobilität + Schwimmen','2×10 Min. zügig','Ruhetag'],['40 Min. locker + Kraft A','Schwimmen','5×600 m, 2:30 Min. Pause','Kraft B reduziert + Parcours 3 Runden','Schwimmen','55–60 Min. locker','Ruhetag'],['Klimmzugtest + Kraft A','Schwimmen','4×800 m','Kraft B','Schwimmen','45–50 Min. locker','Ruhetag'],['40–45 Min. locker + Kraft A','Schwimmen + Tauchen','10×200 m, 90 Sek. Pause','Kraft B reduziert + Parcours 4 Runden','Schwimmen + Tauchen','55–60 Min. locker','Ruhetag'],['35–40 Min. locker + Kraft A','Schwimmen','400-m-Test','Kraft B','Schwimmen','3×8 Min. zügig','Ruhetag'],['40–45 Min. locker + Kraft A','Schwimmen + Tauchen','5×1.000 m','Kraft B reduziert + Parcours 4 Runden','Schwimmen + Tauchen','60–65 Min. locker','Ruhetag'],['30–35 Min. locker + Kraft A','Schwimmen','4×200 m schnell','Kraft B','Schwimmen','5-km-Abschlusstest','Ruhetag']];let k=()=>`sek-${W}-${D}`,g=()=>JSON.parse(localStorage.getItem(k())||'{}');function u(){ws.innerHTML=A.map((x,i)=>`<button class="${i==W?'on':''}" onclick="W=${i};D=0;u()">Woche ${i+1}</button>`).join('');ds.innerHTML=N.map((x,i)=>`<button class="${i==D?'on':''}" onclick="D=${i};u()">${x}</button>`).join('');let x=g();title.textContent=`WOCHE ${W+1} · ${N[D]}`;task.textContent=A[W][D];rp.textContent=D==6?'RUHETAG':D==2?'ZIEL-RPE 7–8':'ZIEL-RPE 3–4 / 6–7';done.checked=!!x.done;r.value=x.r||'';res.value=x.res||'';n.value=x.n||''}f.onsubmit=e=>{e.preventDefault();localStorage.setItem(k(),JSON.stringify({done:done.checked,r:r.value,res:res.value,n:n.value}));ok.style.display='inline';setTimeout(()=>ok.style.display='none',1600)};u()</script>
