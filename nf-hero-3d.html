<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>N/F — 3D Logo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010204}#stage{position:relative;width:100%;height:100%;overflow:hidden;display:grid;place-items:center;perspective:1200px;touch-action:none;cursor:grab;background:radial-gradient(ellipse at center,#0a1119 0%,#020407 44%,#000 100%)}#stage:active{cursor:grabbing}.halo{position:absolute;width:min(88vw,1020px);aspect-ratio:1;background:radial-gradient(ellipse,rgba(0,111,255,.16),transparent 63%);filter:blur(22px);pointer-events:none}.logo-rig{position:relative;width:min(88vw,1040px);height:min(88vh,1040px);display:grid;place-items:center;transform-style:preserve-3d;will-change:transform}.logo-rig::before{content:'';position:absolute;inset:8%;background:#006dff;opacity:.18;filter:blur(28px);transform:translateZ(-45px);clip-path:polygon(7% 15%,92% 15%,87% 86%,11% 86%)}.logo{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 22px 30px rgba(0,0,0,.78)) drop-shadow(0 0 10px rgba(0,122,255,.5));transform:translateZ(26px);user-select:none;-webkit-user-drag:none}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#9ed8ff;opacity:.52;white-space:nowrap;font:700 9px/1 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;pointer-events:none}@media(max-width:600px){.logo-rig{width:112vw;height:86vh}.hint{bottom:13px;font-size:8px}}
</style>
</head>
<body>
<main id="stage" aria-label="Interaktives vollständiges N/F 3D-Logo"><div class="halo"></div><div class="logo-rig" id="rig"><img class="logo" src="IMG_2071.png" alt="N/F-Logo mit Figuren, Bergen und Lichtlinien"></div><div class="hint">N/F · DRAG TO ROTATE</div></main>
<script>
const stage=document.querySelector('#stage'),rig=document.querySelector('#rig');let sx=0,sy=0,targetX=0,targetY=0,rotateX=0,rotateY=0,dragging=false,pausedUntil=0;stage.addEventListener('pointerdown',e=>{dragging=true;sx=e.clientX;sy=e.clientY;pausedUntil=performance.now()+1600;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!dragging)return;targetY+=(e.clientX-sx)*.22;targetX+=(e.clientY-sy)*.10;targetX=Math.max(-14,Math.min(14,targetX));sx=e.clientX;sy=e.clientY;pausedUntil=performance.now()+1600});stage.addEventListener('pointerup',()=>{dragging=false;pausedUntil=performance.now()+1100});stage.addEventListener('pointercancel',()=>dragging=false);let time=0;function render(){time+=.011;const resume=Math.max(0,Math.min(1,(performance.now()-pausedUntil)/1800));const autoY=Math.sin(time*.72)*10*resume;const autoX=Math.sin(time*.46)*2.2*resume;rotateY+=(targetY+autoY-rotateY)*.06;rotateX+=(targetX+autoX-rotateX)*.06;rig.style.transform=`rotateX(${-4-rotateX}deg) rotateY(${-10+rotateY}deg)`;if(!dragging){targetX*=.985;targetY*=.985}requestAnimationFrame(render)}render();
</script>
</body>
</html>
