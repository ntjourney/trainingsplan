<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>N/F 3D Hero</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020304}#hero{height:100%;position:relative;overflow:hidden;perspective:1200px;touch-action:none;cursor:grab;background:#020304}#hero:active{cursor:grabbing}.keyart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;filter:brightness(.42) contrast(1.2)}.shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 10%,rgba(0,0,0,.1) 38%,rgba(0,0,0,.78) 100%)}.rig{position:absolute;left:50%;top:46%;width:min(85vw,1000px);aspect-ratio:2.12;transform-style:preserve-3d;will-change:transform}.piece{position:absolute;transform-style:preserve-3d;background:linear-gradient(125deg,#182027 0%,#d8dde0 18%,#69737b 44%,#1a2026 76%,#bac3ca 100%);border:1px solid #d7e2e9;box-shadow:inset 0 0 18px rgba(255,255,255,.26),0 0 8px #008cff,0 0 28px rgba(0,110,255,.28)}.piece:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 4px,rgba(0,0,0,.075) 5px 6px);mix-blend-mode:multiply}.piece:after{content:'';position:absolute;inset:0;background:#151b20;transform:translateZ(-30px);filter:brightness(.48)}.n1{left:1%;top:10%;width:11%;height:83%;clip-path:polygon(0 0,100% 6%,68% 100%,0 100%);transform:translateZ(12px)}.n2{left:10%;top:10%;width:29%;height:84%;clip-path:polygon(0 0,32% 0,100% 100%,68% 100%);transform:translateZ(34px)}.n3{left:38%;top:10%;width:11%;height:84%;clip-path:polygon(18% 0,100% 0,78% 100%,0 100%);transform:translateZ(12px)}.f1{left:49%;top:18%;width:11%;height:76%;clip-path:polygon(14% 0,100% 0,64% 100%,0 100%);transform:translateZ(16px)}.f2{left:55%;top:10%;width:42%;height:21%;clip-path:polygon(14% 0,100% 0,82% 100%,0 100%);transform:translateZ(34px)}.f3{left:61%;top:48%;width:34%;height:20%;clip-path:polygon(13% 0,100% 0,78% 100%,0 100%);transform:translateZ(34px)}.slash{left:64%;top:60%;width:29%;height:33%;clip-path:polygon(0 65%,28% 65%,100% 0,73% 100%);transform:translateZ(25px);background:linear-gradient(130deg,#071018,#9eaab2 44%,#151b20)}.glow{position:absolute;background:#0094ff;box-shadow:0 0 7px #0094ff,0 0 24px #006dff;opacity:.92;height:2px;transform:translateZ(-8px)}.g1{left:0;bottom:5%;width:52%;transform:rotate(-43deg) translateZ(-8px)}.g2{right:0;bottom:7%;width:50%;transform:rotate(-43deg) translateZ(-8px)}.hint{position:absolute;bottom:18px;width:100%;text-align:center;color:#96d3ff;opacity:.5;font:700 9px Arial;letter-spacing:.23em}@media(max-width:600px){.rig{width:112vw;top:43%}.keyart{object-fit:cover}}</style></head><body><main id="hero"><img class="keyart" src="IMG_2071.png" alt="N/F Key-Art"><div class="shade"></div><div class="rig" id="rig"><i class="piece n1"></i><i class="piece n2"></i><i class="piece n3"></i><i class="piece f1"></i><i class="piece f2"></i><i class="piece f3"></i><i class="piece slash"></i><i class="glow g1"></i><i class="glow g2"></i></div><div class="hint">N/F · DRAG TO ROTATE</div></main><script>const h=document.querySelector('#hero'),r=document.querySelector('#rig');let x=0,y=0,rx=0,ry=0,tx=0,ty=0,down=false;h.onpointerdown=e=>{down=true;x=e.clientX;y=e.clientY;h.setPointerCapture(e.pointerId)};h.onpointermove=e=>{if(!down)return;tx+=(e.clientX-x)*.18;ty+=(e.clientY-y)*.09;x=e.clientX;y=e.clientY};h.onpointerup=()=>down=false;let t=0;function a(){t+=.012;if(!down)tx+=(Math.sin(t)*16-tx)*.012;rx+=(tx-rx)*.075;ry+=(ty-ry)*.075;r.style.transform=`translate(-50%,-50%) rotateX(${-7-ry}deg) rotateY(${-13+rx}deg)`;requestAnimationFrame(a)}a()</script></body></html>
