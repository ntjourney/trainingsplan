<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>NØR — 3D Emblem</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#020304; }
    #stage { position:fixed; inset:0; touch-action:none; cursor:grab; background:radial-gradient(ellipse at 50% 46%, #0d1721 0%, #030609 42%, #010102 76%); }
    #stage:active { cursor:grabbing; }
    canvas { width:100%; height:100%; display:block; }
    .label { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); font:600 10px/1.2 system-ui,sans-serif; letter-spacing:.24em; color:#83bce7; opacity:.58; pointer-events:none; white-space:nowrap; text-transform:uppercase; }
    @media (max-width:600px) { .label { bottom:18px; font-size:9px; } }
  </style>
</head>
<body>
  <main id="stage" aria-label="Interaktives NØR 3D-Emblem"><div class="label">Drag to inspect · NØR</div></main>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';
    import { RoomEnvironment } from 'https://unpkg.com/three@0.165.0/examples/jsm/environments/RoomEnvironment.js';

    const mount = document.querySelector('#stage');
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.28;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020406, 0.075);
    const camera = new THREE.PerspectiveCamera(31, innerWidth/innerHeight, .1, 100);
    camera.position.set(0, .1, 13.2);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
    pmrem.dispose();

    const group = new THREE.Group();
    group.rotation.set(-.07, -.28, 0);
    scene.add(group);

    // Brushed, dark-silver PBR material: deliberately restrained rather than chrome.
    const metal = new THREE.MeshStandardMaterial({ color:0x77808a, metalness:.93, roughness:.28, envMapIntensity:1.18 });
    const edgeMetal = new THREE.MeshStandardMaterial({ color:0xb8c1c9, metalness:.94, roughness:.19, envMapIntensity:1.35 });
    const darkMetal = new THREE.MeshStandardMaterial({ color:0x252b32, metalness:.90, roughness:.34, envMapIntensity:.9 });
    const glow = new THREE.MeshBasicMaterial({ color:0x008cff, transparent:true, opacity:.76, blending:THREE.AdditiveBlending, depthWrite:false });

    // Subtle procedural grain for the metal, held in the roughness channel.
    const grain = document.createElement('canvas'); grain.width=grain.height=256;
    const gx = grain.getContext('2d'), id = gx.createImageData(256,256);
    for(let i=0;i<id.data.length;i+=4){ const v=70+Math.random()*80; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; }
    gx.putImageData(id,0,0);
    const grainTex = new THREE.CanvasTexture(grain); grainTex.wrapS=grainTex.wrapT=THREE.RepeatWrapping; grainTex.repeat.set(3,6);
    metal.roughnessMap=grainTex; edgeMetal.roughnessMap=grainTex;

    const bevel = { depth:.48, bevelEnabled:true, bevelThickness:.075, bevelSize:.065, bevelSegments:2, curveSegments:2 };
    function poly(points, material=metal, depth=bevel.depth) {
      const s = new THREE.Shape(); s.moveTo(points[0][0],points[0][1]);
      for(let i=1;i<points.length;i++) s.lineTo(points[i][0],points[i][1]);
      s.closePath();
      const g = new THREE.ExtrudeGeometry(s, {...bevel, depth});
      g.center();
      const m = new THREE.Mesh(g, material); m.castShadow=m.receiveShadow=true; return m;
    }
    function edge(points) {
      const base = poly(points, glow);
      base.scale.set(1.012,1.012,1); base.position.z=-.275; return base;
    }

    // Custom polygonal construction retains the angular NØR identity from the supplied mark.
    const pieces = [
      // N: monumental left stem and wide diagonal stroke
      [[-5.55,-2.80],[-4.68,-2.18],[-3.72,2.72],[-4.62,2.78]],
      [[-4.63,2.78],[-3.63,2.76],[.04,-2.78],[-.96,-2.12]],
      [[-1.06,-2.78],[-.16,-2.18],[.36,2.78],[-.62,2.78]],
      // Ø: upper / lower strokes and inner angled slash (the Ø cut remains conspicuous)
      [[.58,1.60],[1.37,2.62],[5.28,2.62],[4.65,1.61]],
      [[.62,.12],[1.34,.12],[1.08,-2.74],[.23,-2.72]],
      [[1.75,-.06],[5.17,-.06],[4.43,-1.00],[2.46,-1.00]],
      [[2.42,-1.00],[4.52,-1.00],[3.52,-2.73],[2.53,-2.73]],
      // Ø diagonal bridge, matching the hard tactical slash language
      [[1.45,-2.74],[2.18,-2.74],[5.50,2.75],[4.78,2.75]],
    ];
    pieces.forEach((p,i)=> { const a=edge(p); group.add(a); const m=poly(p, i===7 ? edgeMetal : metal); group.add(m); });

    // Hairline blue light seams under the lower silhouettes.
    function line(a,b) { const g=new THREE.CylinderGeometry(.018,.018,new THREE.Vector2(b[0]-a[0],b[1]-a[1]).length,8); const l=new THREE.Mesh(g,glow); const x=(a[0]+b[0])/2,y=(a[1]+b[1])/2; l.position.set(x,y,-.34); l.rotation.z=-Math.atan2(b[0]-a[0],b[1]-a[1]); group.add(l); }
    line([-5.5,-2.82],[-4.62,2.8]); line([-.98,-2.79],[-.62,2.8]); line([1.42,-2.76],[5.52,2.77]);

    // Ground haze, almost imperceptible and mobile-friendly.
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(42,42), new THREE.MeshStandardMaterial({color:0x020609,roughness:.8,metalness:.15}));
    floor.rotation.x=-Math.PI/2; floor.position.y=-3.65; floor.receiveShadow=true; scene.add(floor);

    function light(color,intensity,x,y,z) { const l=new THREE.DirectionalLight(color,intensity); l.position.set(x,y,z); l.castShadow=true; l.shadow.mapSize.set(1024,1024); scene.add(l); return l; }
    light(0xe4f2ff,3.1,-5,6,7); light(0x006eff,3.0,6,1,4); light(0x78c8ff,1.3,-2,-2,-3);
    const bluePoint=new THREE.PointLight(0x0077ff,22,13,2); bluePoint.position.set(2.5,1,3); scene.add(bluePoint);
    scene.add(new THREE.AmbientLight(0x172130,.62));

    let dragging=false, lastX=0, lastY=0, userYaw=0, userPitch=0, idleAt=0;
    function start(e){ dragging=true; lastX=e.clientX; lastY=e.clientY; idleAt=performance.now(); }
    function move(e){ if(!dragging)return; userYaw += (e.clientX-lastX)*.008; userPitch=THREE.MathUtils.clamp(userPitch+(e.clientY-lastY)*.004,-.28,.22); lastX=e.clientX; lastY=e.clientY; idleAt=performance.now(); }
    function end(){ dragging=false; idleAt=performance.now(); }
    renderer.domElement.addEventListener('pointerdown',start); window.addEventListener('pointermove',move); window.addEventListener('pointerup',end);

    const clock=new THREE.Clock();
    function render(){
      const t=clock.getElapsedTime();
      // A sinusoidal yaw, not a perpetual spin: its first and final frame match exactly.
      const auto = Math.sin(t*.19)*.17;
      const resume = Math.min(1, Math.max(0,(performance.now()-idleAt-900)/1600));
      group.rotation.y = -.28 + userYaw + auto*resume;
      group.rotation.x = -.07 + userPitch;
      bluePoint.intensity = 17 + Math.sin(t*.38)*5;
      renderer.render(scene,camera);
      requestAnimationFrame(render);
    }
    render();
    addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  </script>
</body>
</html>
